/**:
  ekf_filter_node:
    ros__parameters:
      frequency: 4.0
      sensor_timeout: 0.2
      two_d_mode: true
      transform_time_offset: 0.0
      transform_timeout: 0.0

      print_diagnostics: true
      debug: false

      publish_tf: false
      publish_acceleration: false

      map_frame: blinky/map
      odom_frame: blinky/odom
      base_link_frame: blinky/base_footprint
      world_frame: blinky/odom

      # Wheel odometry input
      odom0: odom
      odom0_config: [true,  true,  false,
                      false, false, false,
                      true,  false, false,
                      false, false, true,
                      false, false, false]
      odom0_differential: false
      odom0_relative: true

      # IMU input
      imu0: imu
      imu0_config: [false, false, false,
                    true,  true,  true,
                    false, false, false,
                    true,  true,  true,
                    true, true, true]
      imu0_differential: false
      imu0_relative: false
      imu0_remove_gravitational_acceleration: true

      odom1: odometry/gps
      odom1_config: [true,  true,  false,
                      false, false, false,
                      false,  false, false,
                      false, false, false,
                      false, false, false]
      odom1_differential: false
      odom1_relative: false

/**:
  navsat_transform_node:
    ros__parameters:
      gps_topic: fix
      imu_topic: imu

      world_frame: blinky/odom   # match EKF
      publish_filtered_gps: true
      wait_for_datum: false
      frequency: 4.0
      zero_altitude: true