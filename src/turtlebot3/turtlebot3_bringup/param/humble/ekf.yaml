/**:
  ekf_filter_node:
    ros__parameters:
      # The EKF owns odom -> base_footprint and publishes the fused estimate on
      # odom (robot.launch.py remaps odometry/filtered), so SLAM, Nav2 and the
      # helper nodes read it without changes. turtlebot3_node moves to
      # odom/wheel and stops publishing TF. robot.launch.py overrides the frames
      # with the robot's namespace; outdoor runs add ekf_gps.yaml on top.
      frequency: 30.0
      sensor_timeout: 0.1
      two_d_mode: true
      transform_time_offset: 0.0
      transform_timeout: 0.0

      print_diagnostics: true
      debug: false

      publish_tf: true
      publish_acceleration: false

      map_frame: blinky/map
      odom_frame: blinky/odom
      base_link_frame: blinky/base_footprint
      world_frame: blinky/odom

      # Order: x, y, z, roll, pitch, yaw,
      #        vx, vy, vz, vroll, vpitch, vyaw,
      #        ax, ay, az

      # Wheel encoders: forward speed only. Wheel yaw rate is left out: its
      # message covariance is a fixed 0.001 that would outvote the gyro, and it
      # is the term that goes wrong first when a wheel slips during a turn.
      # (vy is not worth fusing either; the driver gives it a 1e9 variance.)
      odom0: odom/wheel
      odom0_config: [false, false, false,
                     false, false, false,
                     true,  false, false,
                     false, false, false,
                     false, false, false]
      odom0_differential: false
      odom0_relative: false
      odom0_queue_size: 10

      # OpenCR IMU: the firmware's gyro+accel heading (the magnetometer reads
      # zero on these boards, so it never jumps near metal) and the gyro rate.
      # Accelerations stay out; double-integrating them adds drift, not data.
      # relative: true starts heading at 0 like the wheel odometry did.
      imu0: imu
      imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    false, false, false]
      imu0_differential: false
      imu0_relative: true
      imu0_queue_size: 10
      imu0_remove_gravitational_acceleration: true

      # Stereo visual odometry (stereo_visual_odometry.py, started with the
      # stereo pair in navigation2_slam.launch.py). Forward speed and yaw rate
      # from the cameras, an independent check on the wheels and the gyro.
      # Absent on robots without a calibrated pair; the EKF then runs on
      # wheels + IMU. Readings far from the current estimate are rejected.
      odom1: odom/visual
      odom1_config: [false, false, false,
                     false, false, false,
                     true,  false, false,
                     false, false, true,
                     false, false, false]
      odom1_differential: false
      odom1_relative: false
      odom1_queue_size: 5
      odom1_twist_rejection_threshold: 4.0
