/**:
  turtlebot3_node:
    ros__parameters:

      # Hardware-facing defaults for the Burger base. These are the values the
      # OpenCR / base driver expects before any fleet-specific launch logic.
      enable_stamped_cmd_vel: false

      opencr:
        id: 200
        baud_rate: 1000000
        protocol_version: 2.0

      wheels:
        separation: 0.160
        radius: 0.033

      motors:
        profile_acceleration_constant: 214.577

        # [rev/min2]
        # ref) http://emanual.robotis.com/docs/en/dxl/x/xl430-w250/#profile-acceleration
        profile_acceleration: 0.0

      sensors:
        bumper_1: 0
        bumper_2: 0
        illumination: 0
        ir: 0
        sonar: 0
      ultrasonic:
        # Basic filtering for the raw OpenCR ultrasonic stream before it reaches
        # the higher-level scan-fusion / triangulation helpers.
        min_valid_range: 0.02
        max_valid_range: 3.0
        use_jump_filter: true
        max_delta_per_cycle: 0.35
        max_hold_cycles: 12
        release_step_per_cycle: 0.08
        left_offset: 0.0
        front_offset: 0.0
        right_offset: 0.0
/**:
  diff_drive_controller:
    ros__parameters:

      odometry:
        # publish_tf is true here so the robot can run standalone; fleet launch
        # later decides whether those transforms stay namespaced or get relayed.
        publish_tf: true
        use_imu: true
        frame_id: "odom"
        child_frame_id: "base_footprint"