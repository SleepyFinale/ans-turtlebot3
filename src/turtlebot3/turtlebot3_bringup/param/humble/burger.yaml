/**:
  turtlebot3_node:
    ros__parameters:

      enable_stamped_cmd_vel: false

      opencr:
        id: 200
        baud_rate: 1000000
        protocol_version: 2.0

      wheels:
        separation: 0.160
        radius: 0.033

      motors:
        profile_acceleration_constant: 214.577

        # [rev/min2]
        # ref) http://emanual.robotis.com/docs/en/dxl/x/xl430-w250/#profile-acceleration
        profile_acceleration: 0.0

      sensors:
        bumper_1: 0
        bumper_2: 0
        illumination: 0
        ir: 0
        sonar: 0
/**:
  diff_drive_controller:
    ros__parameters:

      odometry:
        publish_tf: true
        use_imu: true
        frame_id: "odom"
        child_frame_id: "base_footprint"
/**:
  ekf_filter_node:
    ros__parameters:

      frequency: 30.0
      sensor_timeout: 0.1
      two_d_mode: true

      publish_tf: true
      publish_acceleration: false

      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: odom

      # Wheel odometry
      odom0: odom
      odom0_config: [true,  true,  false,
                    false, false, true,
                    true,  false, false,
                    false, false, true,
                    false, false, false]

      odom0_differential: false
      odom0_relative: false

      # IMU
      imu0: imu
      imu0_config: [false, false, false,
                    true,  true,  true,
                    false, false, false,
                    true,  true,  true,
                    false, false, false]

      imu0_differential: false
      imu0_relative: false
      imu0_remove_gravitational_acceleration: true
/**:
  navsat_transform_node:
    ros__parameters:
      gps_topic: fix
      imu_topic: imu
      frequency: 30.0
      zero_altitude: true