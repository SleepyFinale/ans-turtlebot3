# Nav2 parameters for the robot-side SLAM + navigation launch
# (navigation2_slam.launch.py). The launch rewrites frames and topics for the
# robot's namespace and adds the stereo, low-obstacle memory and ultrasonic
# layers, so this file names logical roles (map, odom, scan_normalized) only.
# SLAM's own parameters are in mapper_params_online_async_fast.yaml.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    # default_nav_to_pose_bt_xml is set by the launch to
    # behavior_trees/navigate_to_pose_explore.xml (Nav2's stock tree with
    # use_custom_bt_recovery_tree:=false).
    # Reduce BT tick pressure on the Pi (default 10 ms).
    bt_loop_duration: 100
    # Milliseconds. The upstream 20 ms produced false "acknowledge goal" /
    # costmap-clear timeouts under SLAM + bridge load.
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    # De-rated control loop for the Pi.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Patience before follow_path aborts on repeated "collision ahead".
    # Long enough for one replan (~1 Hz) to replace a grazing arc, short enough
    # that a truly blocked heading still falls through to recovery.
    failure_tolerance: 0.8
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      # Rotation does not count as progress, so allow a turn plus a stop gate.
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # Exploration goals are points; heading is not required.
      yaw_goal_tolerance: 3.14

    # Regulated Pure Pursuit: follows the global path's geometry (DWB fell
    # into GoalDist local minima at corners and doorways).
    #
    # min_lookahead_dist must stay above general_goal_checker.xy_goal_tolerance
    # (0.25 m): RPP treats a carrot closer than that as "at the goal" and
    # commands zero linear velocity, which froze the robot in place.
    # Corner-cutting is handled by the planner (inflation and
    # cost_travel_multiplier below), not by shrinking the lookahead.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.45
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.55
      lookahead_time: 1.8
      # 1.4 of the Burger's 2.8 rad/s. At 1.0, turning in place was 11% of
      # an exploration run; faster smears LiDAR scans for SLAM.
      rotate_to_heading_angular_vel: 1.4
      # map->odom can lag under Pi load; a wider window avoids extrapolation
      # aborts (paired with the costmaps' transform_tolerance).
      transform_tolerance: 4.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # How far ahead (s) the current arc is checked for collision. At 1.0 s
      # (22 cm at full speed) arcs the next tick would have straightened
      # stopped the robot beside chair legs and box corners: 300 "collision
      # ahead" in one run, most with the obstacle 0.17 m to the side. 0.7 s
      # still looks 8-15 cm ahead at the slowed speeds near obstacles; the
      # Burger stops within about a centimetre.
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      # Slows down where the local costmap's inflation is high, i.e. close
      # to obstacles, so a grazing approach has time to be corrected.
      use_cost_regulated_linear_velocity_scaling: true
      # Slows down within this distance (robot centre to obstacle). At 0.4 m
      # Inky drove slowed half of a run in a furnished room, at 0.08 m/s on
      # average against 0.22 m/s; 0.3 m still slows the last ~15 cm of body
      # clearance.
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      # Must equal local_costmap inflation_layer.cost_scaling_factor.
      inflation_cost_scaling_factor: 4.0
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      # ~30 deg. Lower values make the robot spin in place on ordinary curves;
      # SimpleProgressChecker does not count rotation as movement.
      rotate_to_heading_min_angle: 0.52
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.5
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 4.0
      transform_timeout: 0.75
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # The controller (collision ahead), spin and backup check this circle.
      # The Burger body reaches 0.125 m from base_footprint; 0.13 m left the
      # wheels clipping chair legs (splayed legs and caster feet reach a few
      # cm past what the LiDAR sees). The global costmap uses 0.18 m so the
      # planner only routes through gaps the controller clears with a few cm
      # to spare; with both at 0.15 m the robot drove up to a gap that just
      # fit on the planner's map, aborted, and replanned the same gap again.
      robot_radius: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Only cost (never lethal) beyond robot_radius; RPP slows down in it
        # (cost_scaling_dist). Matches the global costmap.
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 4.0
      transform_timeout: 0.75
      # Above the local costmap's 0.15 m so planned gaps are passable for the
      # controller (see local_costmap robot_radius). stuck_detector lowers
      # this to 0.15 m for a while when the robot is stuck behind a gap the
      # controller let it through (squeeze_*; squeeze_normal_radius_m must
      # match the value here).
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True
        # Latest map update overwrites stale cells instead of keeping the max.
        use_maximum: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # At 0.22 m (4 cm past robot_radius) the planner saw no difference
        # between 0.22 m and 2 m of clearance, so paths hugged chair legs and
        # box corners; pure pursuit then cut the corner inside the
        # controller's 0.15 m and stopped on "collision ahead", backed off,
        # replanned the same line and stopped again. Inflation never blocks a
        # gap (only robot_radius does): with 0.45 m the plan keeps its
        # distance where there is room and still threads a doorway or a gap
        # between chairs when there is not.
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    # Smac 2D at 20 Hz could not keep up with large SLAM maps on the Pi.
    expected_planner_frequency: 1.5
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      use_final_approach_orientation: true
      max_on_approach_iterations: 5000
      # Weight of the inflation cost against path length: keeps the path in
      # the middle of corridors and doorways so pure pursuit approaches them
      # head-on.
      cost_travel_multiplier: 3.0
      # Exploration goals sit at the edge of unknown space.
      allow_unknown: true
      max_iterations: 1000000
      smooth_path: true
      # The default w_data (0.2) let the smoother chord-cut corners into door
      # jambs; a higher data weight keeps the path on the cost-aware A* line.
      smoother:
        w_smooth: 0.25
        w_data: 0.6

behavior_server:
  ros__parameters:
    use_sim_time: False
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 4.0
    transform_timeout: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    # Same as controller_frequency. At the default 20 Hz every controller
    # command was sent twice. Other limits stay at the Nav2 defaults.
    smoothing_frequency: 10.0

# Optional robot-side helper (enable_retrace_escape:=true); reads this file.
nav2_retrace_escape:
  ros__parameters:
    pose_buffer_duration_sec: 24.0
    pose_sample_min_dist_m: 0.03
    pose_sample_period_sec: 0.10
    trigger_on_lethal: true
    trigger_on_stall: true
    stall_timeout_sec: 12.0
    stall_min_goal_age_sec: 12.0
    stall_min_history_distance_m: 0.6
    min_retreat_distance_m: 0.55
    max_retreat_distance_m: 2.0
    cooldown_sec: 6.0
    insufficient_history_warn_throttle_sec: 2.0
    retreat_result_timeout_sec: 14.0
    publish_hz: 4.0
    tick_hz: 8.0
    tf_lookup_timeout_sec: 0.12
