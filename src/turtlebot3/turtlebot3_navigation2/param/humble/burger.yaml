# Used by nav2 slam_launch when slam=True. Normalized scan avoids SLAM "expected N readings" errors.
slam_toolbox:
  ros__parameters:
    # In namespaced setups, Nav2 runs inside the robot namespace.
    # Use a relative topic so each instance subscribes to <namespace>/scan_normalized.
    scan_topic: scan_normalized

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.01  # Reduced from 0.05 for faster convergence
    pf_z: 0.95  # Reduced from 0.99 for faster convergence
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1  # Reduced thresholds to update more frequently
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan_normalized
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    # Rewritten to an absolute package-share path in navigation2_slam.launch.py.
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery_with_lethal_escape.xml"
    # Reduce BT tick pressure on SBC CPU (20ms => 50ms).
    bt_loop_duration: 50
    # Allow slower action/service acknowledgements under load.
    default_server_timeout: 100
    enable_groot_monitoring: False # Was true, possibly caused TF timestamp mismatches
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # De-rate control loop on SBC to reduce missed-rate cascades under fleet load.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    # TurtleBot3 is differential drive (no y velocity). Keep this low so it
    # doesn't interfere with controller logic / progress checks.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # Explicitly set which goal checker to use (silences "No goal checker was specified" warning)
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Make this less trigger-happy in dynamic / cluttered spaces.
      required_movement_radius: 0.10
      # Fleet + explorer: align with stall watchdog margin; reduces false
      # "Failed to make progress" while the local controller recovers in tight space.
      movement_time_allowance: 5.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # Treat exploration goals as point targets; heading is not required.
      yaw_goal_tolerance: 3.14

    # Regulated Pure Pursuit (replaces DWB): follows global path geometry; avoids DWB
    # GoalDist local minima at corners/doorways. Tune lookahead on-robot if needed.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.85
      lookahead_time: 1.8
      rotate_to_heading_angular_vel: 1.0
      # Match SLAM / map–odom timing (same rationale as prior DWB block).
      # Fleet map->odom can lag several seconds under map_merge churn; allow
      # extra tolerance so transient lag does not immediately abort control.
      transform_tolerance: 3.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      # Align with local costmap inflation falloff (burger.yaml inflation_layer).
      inflation_cost_scaling_factor: 4.0
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.52
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      # Lower local costmap churn to reduce CPU pressure on Raspberry Pi.
      update_frequency: 2.5
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      # Increased transform tolerance for SLAM (map->odom may update less frequently than AMCL)
      transform_tolerance: 3.0
      transform_timeout: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Slightly larger than physical radius so local plans keep a comfortable
      # distance from walls while still fitting through standard doorways.
      robot_radius: 0.12
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Slightly reduced vs 0.25 to narrow lethal halos at doorframes; if too tight,
        # increase ~0.02 m (see README Nav2 / corners).
        inflation_radius: 0.22
        # Steeper decay than 3.0: narrows the high-cost halo so door centerlines
        # stay more "free" when turning (bag-20260418-162539: robot_cost ~253).
        cost_scaling_factor: 4.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        scan:
          # Relative topic so this resolves to <namespace>/scan_normalized.
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: False # Was true, possibly caused TF timestamp mismatches
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      # Lower global costmap update pressure; map is already throttled.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # Increased transform tolerance for SLAM (map->odom may update less frequently than AMCL)
      transform_tolerance: 3.0
      transform_timeout: 0.5
      # Slightly conservative radius so the global plan prefers the center of
      # free space but still passes through normal doorways.
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      width: 20
      height: 20
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        scan:
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Default to the global /map topic in the base params; the
        # navigation2_slam.launch.py helper will rewrite this to
        # /<namespace>/map when running under a robot namespace.
        map_topic: "/map"
        map_subscribe_transient_local: True
        subscribe_to_updates: True  # Enable incremental map updates for faster map updates
        # Avoid sticky lethal cells during live SLAM updates; latest map update
        # should overwrite stale high-cost artifacts around the robot.
        use_maximum: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match local: slightly tighter halo so global plans stay navigable in doorways.
        inflation_radius: 0.22
        # Match local: steeper inflation falloff for tight door turns (see local note).
        cost_scaling_factor: 4.0
      always_send_full_costmap: False # Was true, possibly caused TF timestamp mismatches
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # NavFn at 20Hz often can't keep up on TB3 + large SLAM maps.
    # Reduce planner cadence to avoid compute bursts during map oscillation.
    expected_planner_frequency: 1.5
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn can produce: "Failed to create a plan from potential when a legal potential was found"
      # when maps are frequently resizing/updating (SLAM). SmacPlanner2D is more robust.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      use_final_approach_orientation: true
      max_on_approach_iterations: 5000 
      # Stronger avoidance of inflated / high-cost cells (2D Smac); steers paths
      # through open corridors when a detour exists. Tune 2.0–3.5 if needed.
      cost_travel_multiplier: 2.0
      # Allow planning through unknown space (needed for SLAM/exploration; avoids "no valid path found" when goal is in growing map).
      allow_unknown: true
      max_iterations: 1000000
      smooth_path: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
      spin_dist: 1.2
    backup:
      plugin: "nav2_recoveries/BackUp"
      backup_dist: 0.20
      backup_speed: 0.06
      # If your robot radius is 0.12, setting this slightly smaller 
      # allows it to move even if it's "touching" a lethal cell.
      simulated_footprint_radius: 0.10 
    wait:
      plugin: "nav2_recoveries/Wait"
      wait_duration: 2.0
    global_frame: odom
    robot_base_frame: base_footprint
    # Increased transform timeout for SLAM (map->odom transforms may have slight delays)
    transform_timeout: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

behavior_server:
  ros__parameters:
    use_sim_time: False
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_dist: 1.2
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.20
      backup_speed: 0.06
    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 2.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 3.0
    transform_timeout: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
