# Used by nav2 slam_launch when slam=True. Normalized scan avoids SLAM "expected N readings" errors.
slam_toolbox:
  ros__parameters:
    # In namespaced setups, Nav2 runs inside the robot namespace.
    # Use a relative topic so each instance subscribes to <namespace>/scan_normalized.
    scan_topic: scan_normalized

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.01  # Reduced from 0.05 for faster convergence
    pf_z: 0.95  # Reduced from 0.99 for faster convergence
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1  # Reduced thresholds to update more frequently
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan_normalized
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    # Reduce BT tick pressure on SBC CPU (20ms => 50ms).
    bt_loop_duration: 50
    # Allow slower action/service acknowledgements under load.
    default_server_timeout: 100
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    # TurtleBot3 is differential drive (no y velocity). Keep this low so it
    # doesn't interfere with controller logic / progress checks.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # Explicitly set which goal checker to use (silences "No goal checker was specified" warning)
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Make this less trigger-happy in dynamic / cluttered spaces.
      required_movement_radius: 0.20
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Debugging is expensive and can cause "Control loop missed rate".
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.16
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.16
      min_speed_theta: 0.15
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.2
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      # Lower sample count to reduce DWB compute per cycle on Pi.
      vx_samples: 15
      vy_samples: 0
      vtheta_samples: 30
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Increased transform tolerance for SLAM (map->odom may update less frequently than AMCL)
      # SLAM Toolbox publishes map->odom at ~20-50Hz, but timing can vary during map updates
      transform_tolerance: 1.5
      xy_goal_tolerance: 0.05
      # CRITICAL: must be below your typical commanded speeds.
      # Your max_vel_x is 0.22, so 0.25 makes DWB think you're always stopped.
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Prioritize obstacle avoidance over strict path hugging.
      BaseObstacle.scale: 6.0
      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 12.0
      GoalDist.scale: 14.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      # Increased transform tolerance for SLAM (map->odom may update less frequently than AMCL)
      transform_tolerance: 1.5
      transform_timeout: 0.2
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Slightly larger than physical radius so local plans keep a comfortable
      # distance from walls while still fitting through standard doorways.
      robot_radius: 0.12
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Keep a safety halo while reducing over-inflation that can trap the
        # robot in "starting point in lethal space" states near walls/corners.
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        scan:
          # Relative topic so this resolves to <namespace>/scan_normalized.
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 4.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # Increased transform tolerance for SLAM (map->odom may update less frequently than AMCL)
      transform_tolerance: 1.5
      transform_timeout: 0.2
      # Slightly conservative radius so the global plan prefers the center of
      # free space but still passes through normal doorways.
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      width: 20
      height: 20
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        scan:
          topic: scan_normalized
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Default to the global /map topic in the base params; the
        # navigation2_slam.launch.py helper will rewrite this to
        # /<namespace>/map when running under a robot namespace.
        map_topic: "/map"
        map_subscribe_transient_local: True
        subscribe_to_updates: True  # Enable incremental map updates for faster map updates
        use_maximum: false  # Use overwrite to preserve unknown space for frontier detection
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Balanced inflation: keep global plans off walls and corners without
        # frequently considering the robot to start in lethal space in tight
        # lab corridors.
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # NavFn at 20Hz often can't keep up on TB3 + large SLAM maps.
    expected_planner_frequency: 3.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn can produce: "Failed to create a plan from potential when a legal potential was found"
      # when maps are frequently resizing/updating (SLAM). SmacPlanner2D is more robust.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      # Allow planning through unknown space (needed for SLAM/exploration; avoids "no valid path found" when goal is in growing map).
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    # Increased transform timeout for SLAM (map->odom transforms may have slight delays)
    transform_timeout: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.5
    transform_timeout: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
